- aid: bonneville-power-administration:bonneville-power-administration-data-search-api
  name: Bonneville Power Administration Data Search API
  description: >-
    BPA's ArcGIS Hub site publishes a real OGC API Records catalog search over the agency's
    open geospatial data — 17 operations across collections, items, queryables, related and
    connected records, aggregations, and a GeoService projection of any collection. The
    service declares nine OGC conformance classes about itself (API Common Parts 1 and 2,
    Features Part 1 core/geojson/oas30, Records Part 1 core/json) and ships its own
    OpenAPI 3.0 definition. No credential is required.
