    type: DataAPI
  - url: https://transmission.bpa.gov/business/operations/wind/baltwg.txt
    type: DataFeed
    name: Balancing Authority load and total wind generation — plain text, 5-minute intervals, rolling 7 days
  description: >-
    BPA publishes real-time and historical wind and solar generation data for the Balancing Authority
    area. Data includes total wind generation, total solar generation, net generation, and load data available
    for download. The data is used for grid operations planning and renewable energy tracking.
