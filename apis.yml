- aid: bonneville-power-administration:gis-data-api
  name: BPA GIS Data Hub API
  tags:
  - ArcGIS
  - GeoServices
  - GIS
  - Government
  - Geospatial
  - WFS
  - WMS
  humanURL: https://data-bpagis.hub.arcgis.com
  baseURL: https://services3.arcgis.com/Iz3chmSt4P7oOoZy/arcgis/rest
  properties:
  - url: https://data-bpagis.hub.arcgis.com
    type: Documentation
  - url: >-
      https://data-bpagis.hub.arcgis.com/datasets/998ba568128d46c0a38e285235b55d0c_0/geoservice
    type: GeoService
  description: >-
    The BPA GIS Data Hub provides publicly available geospatial data from Bonneville Power Administration.
    The hub is built on ArcGIS and supports data downloads in multiple formats including CSV, KML, GeoJSON,
    GeoTIFF, and PNG. Developer API access is available through GeoServices (ArcGIS REST API), WMS (Web
    Map Service), and WFS (Web Feature Service) endpoints. Datasets include BPA service area boundaries,
    transmission infrastructure, and energy facility data.
