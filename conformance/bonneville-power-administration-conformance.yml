not_applicable:
- standard: Green Button / ESPI
  reason: >-
    Green Button covers RETAIL customer meter data. BPA is a federal wholesale power
    marketer and transmission operator; it has no retail meter accounts, so the standard
    its regime map lists for energy_utilities does not attach to this provider.
- standard: IEEE 2030.5 / OpenADR
  reason: >-
    Distributed-energy-resource and demand-response signalling standards for the
    distribution edge. BPA operates bulk transmission and a Balancing Authority; no such
    interface is published.
- standard: CDR Energy (Australia) / Smart Energy Code (GB)
  reason: Non-US regimes; BPA is a US federal agency operating only in the Pacific Northwest.
compliance_programs:
  published: false
  note: >-
    No SOC 2, ISO 27001, FedRAMP or PCI attestation is published for any BPA public data
    surface. BPA is a US federal agency under the Department of Energy and inherits
    FISMA obligations, but publishes no certification artifact this pipeline could fetch,
    so no Compliance pointer is wired.
