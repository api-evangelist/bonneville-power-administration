openapi: 3.2.0
info:
  title: Bonneville Power Administration Data Search Geoservice Beta…
  description: Welcome to the Search API.
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Geoservice-Beta
paths:
  /api/search/v1/rest/info:
    get:
      operationId: GeoserviceController_restInfo_api/search/v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestInfoDto'
      tags:
      - Geoservice-Beta
      summary: Geoservice controller rest info api/search/v1
      x-summary-source: derived
  /api/search/v1/rest/services/collections/{collectionId}/geoservice/FeatureServer:
    get:
      operationId: GeoserviceController_featureServer_api/search/v1
      parameters:
      - name: collectionId
        required: true
        in: path
        description: Key/id of the collection for which item should be filtered and returned.
        schema:
          example: dataset
          type: string
      - name: q
        required: false
        in: query
        description: A general text search filter.
        schema:
          title: q
          type: string
      - name: bbox
        required: false
        in: query
        description: A bbox filter, must be 4 comma-separated coordinates
        schema:
          title: bbox
          type: string
      - name: filter
        required: false
        in: query
        description: query parameter that represents a parse-able string of filter expressions, structured according to the <a href="https://portal.ogc.org/files/96288">Common Query Language Specification of the OGC Features API</a>. If filter values must include whitespace, try wrapping the value in single quotes.
        schema:
          title: filter
          type: string
        examples:
          equals:
            summary: Equals
            value: type='Feature Service'
          greaterThan:
            summary: Greater Than
            value: created > 1670531235
          greaterThanOrEquals:
            summary: Greater Than Or Equals
            value: created >= 1670531235
          LessThan:
            summary: Less Than
            value: created < 1670531235
          lessThanOrEquals:
            summary: Less Than Or Equals
            value: created <= 1670531235
          in:
            summary: IN
            value: tags IN (tag1, 'tag2', tag3)
          notIn:
            summary: NOT IN
            value: tags NOT IN (tag1, 'tag2', tag3)
          betweenAnd:
            summary: BETWEEN AND
            value: created BETWEEN 1670531235 AND 1770531235
          notBetweenAnd:
            summary: NOT BETWEEN AND
            value: created NOT BETWEEN 1670531235 AND 1770531235
          like:
            summary: LIKE
            value: description LIKE 'moby*'
          'null':
            summary: IS NULL
            value: source IS NULL
          notNull:
            summary: IS NOT NULL
            value: owner IS NOT NULL
          and:
            summary: AND
            value: tags NOT IN (tag1, 'tag2', tag3) AND owner IS NOT NULL
          or:
            summary: OR
            value: tags NOT IN (tag1, 'tag2', tag3) OR owner IS NOT NULL
          not:
            summary: NOT
            value: tags NOT IN (tag1, 'tag2', tag3) NOT owner IS NULL
          subExpressions:
            summary: Subexpressions
            value: ((type='Feature Service' AND access=public) OR (type='Web Mapping Application' AND access=shared))
      - name: limit
        required: false
        in: query
        description: The number of results to return.
        schema:
          title: limit
          type: integer
          minimum: 0
          maximum: 100
      - name: startindex
        required: false
        in: query
        description: The initial index of the results to return, starting at 1.
        schema:
          title: startindex
          type: integer
          minimum: 1
      - name: type
        required: false
        in: query
        description: The type of resource.
        schema:
          title: type
          type: string
          description: the type of the underlying resource
      - name: title
        required: false
        in: query
        description: The title of resource to return.
        schema:
          title: title
          type: string
          description: the title of the underlying resource
      - name: recordId
        required: false
        in: query
        description: The recordId of resource to return. recordId could be itemId or itemId_layerId
        schema:
          title: recordId
          type: string
          description: id of the record
      - name: sortBy
        required: false
        in: query
        description: Sort results by specific fields. Prefixed by either "+" for ascending or "-" for descending. If no prefix is provided, "+" is assumed.
        schema:
          title: sortBy
          type: string
      - name: tags
        required: false
        in: query
        description: Tags for items search
        schema:
          example: 'true'
          type: string
      - name: token
        required: false
        in: query
        description: Token to use when accessing the underlying ArcGIS Item that represents the site.
        schema:
          title: token
          type: string
      - name: openData
        required: false
        in: query
        description: Boolean flag to get items that are shared to Opendata group
        schema:
          example: 'true'
          type: string
      - name: f
        required: false
        in: query
        description: The available output formats for feature server
        schema:
          $ref: '#/components/schemas/FeatureServerFormats'
      - name: where
        required: false
        in: query
        description: Where clause for feature server querying
        schema:
          example: 1=1
      - name: geometryType
        required: false
        in: query
        description: Filter by geometry types
        schema:
          example:
          - esriGeometryPoint
          - esriGeometryMultipoint
          - esriGeometryPolyline
          - esriGeometryPolygon
          - esriGeometryEnvelope
      - name: groupByFieldsForStatistics
        required: false
        in: query
        description: Attribute to use as key for aggregation
        schema:
          example: zipCode
      - name: outStatistics
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/OutputStatistics'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureServerDto'
      tags:
      - Geoservice-Beta
      summary: Geoservice controller feature server api/search/v1
      x-summary-source: derived
