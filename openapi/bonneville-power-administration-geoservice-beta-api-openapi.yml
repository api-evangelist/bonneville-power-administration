        schema:
          title: title
          type: string
          description: the title of the underlying resource
      - name: recordId
        required: false
        in: query
        description: The recordId of resource to return. recordId could be itemId or itemId_layerId
        schema:
          title: recordId
          type: string
          description: id of the record
      - name: sortBy
        required: false
        in: query
        description: Sort results by specific fields. Prefixed by either "+" for ascending or "-" for descending. If no prefix is provided, "+" is assumed.
        schema:
          title: sortBy
          type: string
      - name: tags
        required: false
        in: query
        description: Tags for items search
        schema:
          example: 'true'
          type: string
      - name: token
        required: false
        in: query
        description: Token to use when accessing the underlying ArcGIS Item that represents the site.
        schema:
          title: token
          type: string
      - name: openData
        required: false
        in: query
        description: Boolean flag to get items that are shared to Opendata group
        schema:
          example: 'true'
          type: string
      - name: f
        required: false
        in: query
        description: The available output formats for feature server
        schema:
          $ref: '#/components/schemas/FeatureServerFormats'
      - name: where
        required: false
        in: query
        description: Where clause for feature server querying
        schema:
          example: 1=1
      - name: geometryType
        required: false
        in: query
        description: Filter by geometry types
        schema:
          example:
          - esriGeometryPoint
          - esriGeometryMultipoint
          - esriGeometryPolyline
          - esriGeometryPolygon
          - esriGeometryEnvelope
      - name: groupByFieldsForStatistics
        required: false
        in: query
        description: Attribute to use as key for aggregation
        schema:
          example: zipCode
      - name: outStatistics
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/OutputStatistics'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureLayerQueryDto'
      tags:
      - Geoservice-Beta
      summary: Geoservice controller feature layer query api/search/v1
      x-summary-source: derived
