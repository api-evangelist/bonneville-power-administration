catalog_entities:
- name: Dataset
  source: json-ld/bonneville-power-administration-dcat-us-catalog.json
  count: 21
  description: >-
    DCAT-US Dataset records describing the published BPA layers, each with an identifier,
    landingPage, keyword list, license, spatial extent and a distribution list. The
    "ArcGIS GeoServices REST API" distribution is the callable endpoint; the CSV, GeoJSON,
    KML, Shapefile and File Geodatabase distributions are export downloads.
  note: >-
    The catalog is the authoritative index of what BPA considers published — 21 datasets —
    against 173 FeatureServers visible in the tenant service directory. Prefer the catalog.
