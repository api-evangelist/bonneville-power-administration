description: >-
  Entity model for the BPA GIS Data Hub. Every field name, type and cardinality below was
  read from the live ArcGIS layer definition on 2026-09-06 — none of it is inferred from
  the OpenAPI, which declares no component schemas. The model is flat by construction:
  ArcGIS FeatureServer layers are independent attribute tables plus a geometry, with no
  server-side joins and no foreign-key enforcement.
shape:
  paradigm: geospatial-feature-tables
  identifier_field: OBJECTID
  identifier_type: integer, layer-scoped, system-maintained, NOT stable across republication
  global_identifier_field: GlobalID
  global_identifier_type: GUID, stable across edits where present
  id_prefixes: none
  note: >-
    There is no cross-layer primary key. OBJECTID is unique only within one layer and is
    reassigned when a layer is rebuilt; an integration that persists OBJECTID as a
    long-lived reference will silently drift. Use GlobalID where the layer exposes it.
